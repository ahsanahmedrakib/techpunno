<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#041f16"/>
      <stop offset="0.5" stop-color="#0a3322"/>
      <stop offset="1" stop-color="#083023"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#22c55e" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <g opacity="0.14" stroke="#ffffff" stroke-width="1" stroke-dasharray="2 6">
    <path d="M0 80 L1600 80 M0 240 L1600 240 M0 400 L1600 400 M0 560 L1600 560 M0 720 L1600 720"/>
    <path d="M160 0 L160 900 M480 0 L480 900 M800 0 L800 900 M1120 0 L1120 900 M1440 0 L1440 900"/>
  </g>

  <!-- Skyline silhouette of campus / community -->
  <g opacity="0.28" fill="#0d4931">
    <rect x="0" y="500" width="90" height="120"/>
    <rect x="110" y="470" width="70" height="150"/>
    <rect x="200" y="520" width="80" height="100"/>
    <rect x="300" y="460" width="70" height="160"/>
    <rect x="390" y="510" width="90" height="110"/>
    <rect x="500" y="470" width="70" height="150"/>
    <rect x="590" y="530" width="80" height="90"/>
    <rect x="1240" y="520" width="90" height="100"/>
    <rect x="1350" y="460" width="70" height="160"/>
    <rect x="1440" y="500" width="90" height="120"/>
    <rect x="1520" y="540" width="80" height="80"/>
    <path d="M300 460 L335 420 L370 460 Z" fill="#0d4931"/>
    <path d="M500 470 L535 425 L570 470 Z" fill="#0d4931"/>
    <path d="M1350 460 L1385 415 L1420 460 Z" fill="#0d4931"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="620" width="1600" height="280" fill="#0d4931" opacity="0.55"/>

  <!-- Central giant protective shield, right side -->
  <g transform="translate(1120,330)">
    <circle cx="0" cy="0" r="230" fill="url(#halo)"/>
    <path d="M0 -175 L135 -125 L135 25 C135 130 75 200 0 235 C-75 200 -135 130 -135 25 L-135 -125 Z"
          fill="#0f5740" stroke="#4ade80" stroke-width="4"/>
    <path d="M0 -165 L125 -120 L125 25 C125 120 70 185 0 220 C-70 185 -125 120 -125 25 L-125 -120 Z"
          fill="none" stroke="#22c55e" stroke-width="2" opacity="0.6"/>
    <path d="M0 -130 L60 -60 L0 70 L-60 -60 Z" fill="none" stroke="#86efac" stroke-width="3"/>
    <path d="M0 -100 L0 45" stroke="#4ade80" stroke-width="2.5" opacity="0.8"/>
    <path d="M0 -60 L-38 -10 M0 0 L-34 12 M0 -25 L30 22" stroke="#86efac" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <circle cx="0" cy="-60" r="5" fill="#86efac"/>
    <circle cx="0" cy="20" r="5" fill="#86efac"/>
    <path d="M-34 -10 L34 -10 L0 20 Z" fill="#86efac" opacity="0.6"/>
  </g>

  <!-- Students learning around laptops, left side -->
  <!-- Student 1 -->
  <g transform="translate(150,490) scale(0.9)">
    <ellipse cx="0" cy="6" rx="34" ry="9" fill="#05251a"/>
    <rect x="-20" y="-26" width="40" height="32" rx="4" fill="#1e3a8a"/>
    <circle cx="0" cy="-34" r="13" fill="#fcd9b8"/>
    <path d="M-13 -34 Q0 -46 13 -34 Z" fill="#0f172a"/>
    <rect x="-9" y="-40" width="18" height="3" rx="1.5" fill="#0f172a"/>
    <rect x="-24" y="-10" width="48" height="5" rx="2.5" fill="#1e293b"/>
    <rect x="-16" y="-5" width="32" height="5" rx="2.5" fill="#334155"/>
  </g>
  <!-- Student 2 -->
  <g transform="translate(330,505) scale(0.9)">
    <ellipse cx="0" cy="6" rx="32" ry="9" fill="#05251a"/>
    <rect x="-20" y="-26" width="40" height="32" rx="4" fill="#14532d"/>
    <circle cx="0" cy="-34" r="13" fill="#fce4c8"/>
    <path d="M-13 -34 Q0 -46 13 -34 Z" fill="#0f172a"/>
    <circle cx="-5" cy="-34" r="2" fill="#0f172a" opacity="0.3"/>
    <rect x="-24" y="-10" width="48" height="5" rx="2.5" fill="#1e293b"/>
    <rect x="-16" y="-5" width="32" height="5" rx="2.5" fill="#334155"/>
  </g>
  <!-- Student 3 -->
  <g transform="translate(520,510) scale(0.9)">
    <ellipse cx="0" cy="6" rx="33" ry="9" fill="#05251a"/>
    <rect x="-20" y="-26" width="40" height="32" rx="4" fill="#7c2d12"/>
    <circle cx="0" cy="-34" r="13" fill="#fcd9b8"/>
    <path d="M-13 -34 Q0 -46 13 -34 Z" fill="#0f172a"/>
    <path d="M-12 -28 Q0 -20 12 -28 L12 -20 Q0 -12 -12 -20 Z" fill="#0f172a"/>
    <rect x="-24" y="-10" width="48" height="5" rx="2.5" fill="#1e293b"/>
    <rect x="-16" y="-5" width="32" height="5" rx="2.5" fill="#334155"/>
  </g>

  <!-- Network connecting students to shield -->
  <g stroke="#4ade80" stroke-width="2" stroke-dasharray="4 6" opacity="0.6">
    <path d="M700 460 L1000 220"/>
    <path d="M720 470 L1000 260"/>
    <path d="M560 465 L980 300"/>
  </g>
  <g fill="#4ade80" opacity="0.8">
    <circle cx="700" cy="460" r="4"/>
    <circle cx="720" cy="470" r="4"/>
    <circle cx="560" cy="465" r="4"/>
  </g>

  <!-- Small floating tech icons -->
  <g opacity="0.85">
    <g transform="translate(880,180)">
      <rect x="-22" y="-15" width="44" height="30" rx="4" fill="none" stroke="#86efac" stroke-width="2.5"/>
      <rect x="-22" y="-15" width="44" height="6" rx="2" fill="#14532d"/>
      <rect x="-8" y="-3" width="16" height="9" rx="1.5" fill="#86efac"/>
    </g>
    <g transform="translate(1000,120)">
      <rect x="-12" y="-16" width="24" height="20" rx="3" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
      <rect x="-12" y="-4" width="24" height="2.5" rx="1" fill="#fbbf24"/>
      <rect x="-3" y="-16" width="1.5" height="20" fill="#fbbf24" opacity="0.6"/>
      <circle cx="-4" cy="-6" r="1.5" fill="#fbbf24"/>
      <circle cx="-4" cy="0" r="1.5" fill="#fbbf24"/>
    </g>
  </g>

  <!-- Wireframe globe (community / internet) bottom-left -->
  <g transform="translate(150,720)" opacity="0.3">
    <circle r="85" fill="none" stroke="#22c55e" stroke-width="2"/>
    <ellipse rx="85" ry="32" fill="none" stroke="#22c55e" stroke-width="1.5"/>
    <ellipse rx="30" ry="85" fill="none" stroke="#22c55e" stroke-width="1.5"/>
    <ellipse rx="52" ry="85" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.6"/>
    <path d="M-85 0 L85 0" stroke="#22c55e" stroke-width="1"/>
  </g>

  <!-- Sparkle accents -->
  <g fill="#fbbf24" opacity="0.7">
    <path d="M760 130 L763 124 L766 130 L772 133 L766 136 L763 142 L760 136 L754 133 Z"/>
    <path d="M1350 150 L1352 146 L1354 150 L1358 152 L1354 154 L1352 158 L1350 154 L1346 152 Z"/>
    <path d="M950 700 L952 695 L954 700 L959 702 L954 704 L952 709 L950 704 L945 702 Z"/>
  </g>

  <!-- Motion streaks -->
  <g stroke="#4ade80" stroke-width="2" stroke-linecap="round" opacity="0.35">
    <path d="M520 620 L560 620"/>
    <path d="M640 600 L700 600"/>
    <path d="M300 620 L340 620"/>
  </g>
</svg>
